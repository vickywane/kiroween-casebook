version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20 && nvm use 20
        - corepack enable
        - corepack prepare yarn@4.12.0 --activate
        - yarn install --immutable
    build:
      commands:
        # Amplify only exposes console env vars at build time. Next.js reads
        # .env.production at runtime, so copy the app's own vars into it.
        - env | grep -E '^(NEXT_PUBLIC_|CASEBOOK_)' >> .env.production || true
        - yarn build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .yarn/cache/**/*
